name: Build APK
run-name: ${{ inputs.app_name }} v${{ inputs.version }} (APK)

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Comma separated list of repository files to put inside the app'
        required: true
      app_name:
        description: 'App name shown on the phone'
        required: true
        default: 'KS'
      app_id:
        description: 'Android package id, e.g. com.ks.app'
        required: true
        default: 'com.ks.app'
      version:
        description: 'Version name, e.g. 1.0'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FILES: ${{ inputs.files }}
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy the chosen files into www/
        run: |
          set -e
          mkdir -p www
          IFS=',' read -ra LIST <<< "$FILES"
          for f in "${LIST[@]}"; do
            case "$f" in /*|*..*|.*) echo "bad path: $f"; exit 1;; esac
            [ -f "$f" ] || { echo "missing file: $f"; exit 1; }
            mkdir -p "www/$(dirname "$f")"
            cp "$f" "www/$f"
          done
          [ -f www/index.html ] || { echo "index.html must be selected"; exit 1; }
          echo "Files in the app:"; find www -type f | sort

      - name: Create the Android project (Capacitor)
        run: |
          set -e
          mkdir -p /tmp/cap && cp -r www /tmp/cap/www && cd /tmp/cap
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android
          sed -i "s/versionName \".*\"/versionName \"$APP_VERSION\"/; s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle

      - name: Build the APK
        working-directory: /tmp/cap/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SAFE=$(echo "$APP_NAME" | tr -c 'A-Za-z0-9._-' '_')
          OUT="${SAFE}-v${APP_VERSION}-b${GITHUB_RUN_NUMBER}.apk"
          cp /tmp/cap/android/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          gh release create "apk-${GITHUB_RUN_NUMBER}" "$OUT" \
            --title "$APP_NAME v$APP_VERSION" \
            --notes "Files: $FILES" --target "${GITHUB_SHA}"
